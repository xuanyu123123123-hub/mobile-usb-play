            const patterns = [
              [/^(\d+) saved controls$/i, (_,n) => `${n}개 조작 버튼 저장됨`],
              [/^(\d+) mapping(?:s)?$/i, (_,n) => `매핑 ${n}개`],
              [/^(\d+) ADB ready$/i, (_,n) => `ADB ${n}대 준비됨`],
              [/^Live \+ (\d+) pending$/i, (_,n) => `실시간 연결 · ${n}대 대기 중`],
              [/^(\d+) of (\d+)$/i, (_,n,m) => `${m}개 중 ${n}개`],
              [/^All \((\d+)\)$/i, (_,n) => `전체 (${n})`],
              [/^Movement \((\d+)\)$/i, (_,n) => `이동 (${n})`],
              [/^Actions \((\d+)\)$/i, (_,n) => `동작 (${n})`],
              [/^Mouse \((\d+)\)$/i, (_,n) => `마우스 (${n})`],
              [/^Camera Lock: (Active|Off)$/i, (_,state) => `시점 고정: ${state==='Active'?'켜짐':'꺼짐'}`],
              [/^Overlays (On|Off)$/i, (_,state) => `조작 버튼 ${state==='On'?'표시':'숨김'}`],
              [/^Audio: ([A-Za-z-]+)$/i, (_,state) => `소리: ${({'playing':'재생 중','off':'꺼짐','starting':'시작 중','waiting':'대기 중','error':'오류'})[state.toLowerCase()]||state}`],
              [/^(\d+) displays?$/i, (_,n) => `화면 ${n}개`],
              [/^(\d+) encoders?$/i, (_,n) => `인코더 ${n}개`],
              [/^Auto-activated for (.+)$/i, (_,app) => `자동 활성화: ${app}`],
              [/^Linked App: (.+)$/i, (_,app) => `연결된 앱: ${app}`],
              [/^Disconnect (.+)$/i, (_,name) => `${name} 연결 해제`],
              [/^No (all|movement|action|mouse) layers in this profile\.$/i, (_,cat) => `${({'all':'전체','movement':'이동','action':'동작','mouse':'마우스'})[cat]}에 등록된 조작 버튼이 없어.`],
              [/^No profiles found matching (.+)\.$/i, (_,s) => `${s}에 맞는 프로필이 없어.`],
              [/^Missing: (.+)\. Use a current Chromium-based desktop browser over HTTPS or localhost\.$/i, (_,s) => `지원하지 않는 기능: ${s}. HTTPS에서 최신 PC용 Chrome 또는 Edge를 사용해 줘.`],
              [/^(\d+) ADB transports · choose which one owns the video workspace$/i, (_,n) => `ADB 기기 ${n}대 · 화면을 표시할 기기를 선택해 줘`],
              [/^Camera Lock: (Active|Disabled)\. Press ([A-Za-z0-9]+) to toggle$/i, (_,on,k) => `시점 고정: ${on==='Active'?'켜짐':'꺼짐'} · ${k}키로 전환`],
            ];
          
            function translate(value) {
              if (!value || !/[A-Za-z]/.test(value)) return value;
              const match = value.match(/^(\s*)([\s\S]*?)(\s*)$/);
              if (!match) return value;
              const before = match[1], phrase = match[2], after = match[3];
              let output = Object.prototype.hasOwnProperty.call(words, phrase) ? words[phrase] : null;
              if (output === null) {
                for (const [regex, convert] of patterns) {
                  const groups = regex.exec(phrase);
                  if (groups) { output = convert(...groups); break; }
                }
              }
              return output === null ? value : before + output + after;
            }
          
            const skipTags = new Set(['SCRIPT', 'STYLE', 'NOSCRIPT', 'TEXTAREA', 'CODE', 'PRE', 'KBD', 'SVG']);
            const attrs = ['title', 'placeholder', 'aria-label', 'aria-description'];
            function skip(element) {
              return !element || !!element.closest('[contenteditable="true"]') || !!element.closest('[data-mup-no-translate]');
            }
            function visit(node) {
              if (node.nodeType === Node.TEXT_NODE) {
                const parent = node.parentElement;
                if (!parent || skipTags.has(parent.tagName) || skip(parent)) return;
                const next = translate(node.data);
                if (next !== node.data) node.data = next;
                return;
              }
              if (node.nodeType !== Node.ELEMENT_NODE) return;
              const element = node;
              if (skipTags.has(element.tagName) || skip(element)) return;
              for (const name of attrs) {
                if (!element.hasAttribute(name)) continue;
                const original = element.getAttribute(name);
                const next = translate(original);
                if (next !== original) element.setAttribute(name, next);
              }
              // Never translate typed values or stored profile data.
              for (const child of element.childNodes) visit(child);
            }
          
            let scheduled = false;
            const dirty = new Set();
            function flush() {
              scheduled = false;
              const targets = [...dirty]; dirty.clear();
              for (const target of targets) visit(target);
            }
            function queue(target) {
              if (target) dirty.add(target);
              if (!scheduled) { scheduled = true; requestAnimationFrame(flush); }
            }
            const observer = new MutationObserver(records => {
              for (const record of records) {
                if (record.type === 'childList') {
                  for (const node of record.addedNodes) queue(node);
                } else if (record.type === 'characterData') queue(record.target);
                else if (record.type === 'attributes') queue(record.target);
              }
            });
            function init() {
              if (!document.body) return;
              document.title = 'Mobile USB Play v1.1 | 한글 USB 스마트폰 플레이어';
              visit(document.body);
              observer.observe(document.body, {
                subtree:true, childList:true, characterData:true, attributes:true,
                attributeFilter:attrs
              });
              // The UI is recreated dynamically by React; the observer catches new labels.
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once:true});
            else init();
          })();
          """
