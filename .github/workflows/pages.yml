          import json
          root = Path('_site')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')
          if '<html lang="en">' in html:
              html = html.replace('<html lang="en">','<html lang="ko">',1)
          elif '<html' in html and 'lang="ko"' not in html:
              raise RuntimeError('Unknown root HTML language marker')
          if '</body>' not in html:
              raise RuntimeError('Cannot inject Korean UI translation module')
          html = html.replace('Mobile USB Play v1.0', 'Mobile USB Play v1.1')
          html = html.replace('</body>', '  <script defer src="./mobile-usb-ko.js"></script>\n</body>', 1)
